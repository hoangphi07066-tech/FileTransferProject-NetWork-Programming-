<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Đăng Nhập Tập Trung</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient-1: #1e1e24;
            --bg-gradient-2: #2b2b36;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --error-bg: #fef2f2;
            --error-text: #ef4444;
            --border: #cbd5e1;
        }

        body { 
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            height: 100vh; 
            justify-content: center; 
            align-items: center; 
            background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2)); 
            margin: 0; 
            -webkit-font-smoothing: antialiased;
        }

        /* --- HIỆU ỨNG XUẤT HIỆN --- */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card { 
            background: #ffffff; 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
            width: 100%;
            max-width: 360px; 
            box-sizing: border-box;
            text-align: center; 
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* --- TIÊU ĐỀ --- */
        .header-icon {
            background: var(--primary);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            box-shadow: 0 8px 16px rgba(79, 70, 229, 0.3);
        }

        .header-icon svg { width: 32px; height: 32px; }

        h2 { 
            color: var(--text-dark); 
            margin: 0 0 8px 0; 
            font-weight: 700; 
            font-size: 1.5rem;
        }
        
        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0 0 30px 0;
        }

        /* --- Ô NHẬP LIỆU (INPUTS) --- */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            width: 20px;
            height: 20px;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        input { 
            width: 100%; 
            padding: 14px 14px 14px 42px; /* Dành chỗ cho icon bên trái */
            border: 1px solid var(--border); 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 15px; 
            color: var(--text-dark);
            background-color: #f8fafc;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        input:focus + .input-icon {
            color: var(--primary);
        }

        input::placeholder { color: #94a3b8; }

        /* --- NÚT BẤM --- */
        button { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 14px; 
            width: 100%; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600; 
            transition: all 0.3s ease; 
            box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2);
            margin-top: 10px;
        }

        button:hover { 
            background: var(--primary-hover); 
            transform: translateY(-1px);
            box-shadow: 0 6px 12px rgba(79, 70, 229, 0.3);
        }

        button:active {
            transform: translateY(1px);
            box-shadow: none;
        }

        /* --- THÔNG BÁO LỖI --- */
        .error { 
            background-color: var(--error-bg);
            color: var(--error-text); 
            border: 1px solid #fecaca;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px; 
            font-weight: 500;
            margin-top: 20px; 
            display: none; 
            animation: slideUpFade 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="header-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
        </div>
        <h2>File Transfer System</h2>
        <p class="subtitle">Đăng nhập để tiếp tục</p>

        <div class="input-group">
            <input type="text" id="username" placeholder="Tài khoản (user / admin)" required>
            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
        </div>

        <div class="input-group">
            <input type="password" id="password" placeholder="Mật khẩu (123)" required>
            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
        </div>

        <button onclick="handleLogin()">Đăng Nhập</button>
        <div id="errorMsg" class="error">⚠️ Tài khoản hoặc mật khẩu không chính xác!</div>
    </div>

    <script>
        // Hỗ trợ nhấn Enter để đăng nhập
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                handleLogin();
            }
        });

        function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const error = document.getElementById('errorMsg');

            if (user === 'admin' && pass === '123') {
                window.location.href = 'http://localhost:5001/admin.html';
            } else if (user !== '' && pass === '123') {
                // Cho phép user1, user2, john, anna... đăng nhập
                // Đẩy username lên URL để Client biết ai đang dùng
                window.location.href = `http://localhost:5000/client.html?user=${encodeURIComponent(user)}`;
            } else {
                error.style.display = 'block';
            }
        }
    </script>
</body>
</html>
