<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Đăng Nhập Tập Trung</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; justify-content: center; align-items: center; background: #1e1e24; margin: 0; }
        .login-card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 340px; text-align: center; }
        h2 { color: #333; margin-bottom: 25px; font-weight: 600; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background: #4caf50; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #45a049; }
        .error { color: #e53935; font-size: 13px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>File Transfer System</h2>
        <input type="text" id="username" placeholder="Tài khoản (user / admin)" required>
        <input type="password" id="password" placeholder="Mật khẩu (123)" required>
        <button onclick="handleLogin()">Đăng Nhập</button>
        <div id="errorMsg" class="error">Tài khoản hoặc mật khẩu không chính xác!</div>
    </div>

    <script>
        function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const error = document.getElementById('errorMsg');

            if (user === 'admin' && pass === '123') {
                window.location.href = 'http://localhost:5001/admin.html';
            } else if (user !== '' && pass === '123') {
                // Cho phép user1, user2, john, anna... đăng nhập
                // Đẩy username lên URL để Client biết ai đang dùng
                window.location.href = `http://localhost:5000/client.html?user=${encodeURIComponent(user)}`;
            } else {
                error.style.display = 'block';
            }
    }
</script>
</body>
</html>
