<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Server - Quản Trị Kho File</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #2c3e50; color: #ecf0f1; }
        .card { background: #34495e; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { border-bottom: 2px solid #16a085; padding-bottom: 10px; color: #16a085; }
        button { background: #16a085; color: white; border: none; padding: 10px 15px; cursor: pointer; font-weight: bold; border-radius: 4px; }
        ul { list-style: none; padding: 0; }
        li { padding: 12px; border-bottom: 1px solid #4f5d73; font-family: monospace; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Giao Diện Server Admin (Port 5001)</h2>
        <button onclick="fetchFiles()">🔄 Làm mới kho lưu trữ</button>
        <ul id="list">Đang tải dữ liệu...</ul>
    </div>

    <script>
        async function fetchFiles() {
            const res = await fetch('/api/files');
            const files = await res.json();
            const list = document.getElementById('list');
            list.innerHTML = files.length === 0 ? '<li>Thư mục storage đang trống.</li>' : '';
            files.forEach(f => {
                const li = document.createElement('li');
                li.textContent = "📄 " + f;
                list.appendChild(li);
            });
        }
        window.onload = fetchFiles;
    </script>
</body>
</html>
