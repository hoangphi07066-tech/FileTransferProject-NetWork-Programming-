<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Client - Truyền File Đa Luồng</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); width: 500px; text-align: center; position: relative; }
        .logout-btn { position: absolute; top: 15px; right: 15px; background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        h2 { color: #1c1e21; margin: 0 0 5px 0; font-size: 24px; }
        .subtitle { color: #6c757d; font-size: 13px; margin-bottom: 25px; }
        .drop-zone { border: 2px dashed #007bff; border-radius: 8px; padding: 40px 20px; background: #f8f9fa; cursor: pointer; transition: all 0.3s ease; margin-bottom: 25px; }
        .drop-zone:hover, .drop-zone.dragover { background: #eaf3ff; border-color: #0056b3; }
        #fileInput { display: none; }
        #fileInfo { margin-bottom: 20px; font-size: 14px; text-align: left; background: #e9ecef; padding: 15px; border-radius: 8px; display: none; word-break: break-all; }
        button.main-btn { background-color: #28a745; color: white; border: none; padding: 15px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        button.main-btn:disabled { background-color: #6c757d; cursor: not-allowed; }
        .progress-bar-container { background-color: #e9ecef; border-radius: 8px; height: 20px; width: 100%; overflow: hidden; margin-top: 20px; display: none; }
        .progress-bar { background-color: #28a745; height: 100%; width: 0%; transition: width 0.1s linear; }
        #status { font-weight: bold; color: #495057; font-size: 14px; margin-top: 15px; }
        .history-container { margin-top: 30px; text-align: left; }
        .history-container h3 { color: #495057; font-size: 16px; margin-bottom: 10px; border-bottom: 2px solid #e9ecef; padding-bottom: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e9ecef; }
        th { background-color: #f1f3f5; color: #495057; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; }
        .badge.sending { background: #ffc107; color: #212529; }
        .badge.success { background: #28a745; }
        .badge.error { background: #dc3545; }
        .revoke-btn { background: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; transition: background 0.2s; }
        .revoke-btn:hover { background: #c82333; }
    </style>
</head>
<body>

<div class="container">
    <button class="logout-btn" onclick="logout()">Đăng xuất</button>
    <h2>TRANSMIT CLIENT</h2>
    <div class="subtitle" id="welcomeMsg">Xin chào...</div>
    
    <div id="dropZone" class="drop-zone" onclick="document.getElementById('fileInput').click()">
        <p>Kéo thả file vào đây hoặc <span style="color:#007bff; font-weight:bold;">Bấm chọn file</span></p>
    </div>
    <input type="file" id="fileInput" onchange="handleFileSelect(this.files[0])">

    <div id="fileInfo"></div>
    <button id="startBtn" class="main-btn" onclick="startTransfer()" disabled>Bắt đầu Truyền File</button>

    <div id="progressBarContainer" class="progress-bar-container">
        <div id="progressBar" class="progress-bar"></div>
    </div>
    <div id="status">Trạng thái: Vui lòng chọn file...</div>

    <div class="history-container">
        <h3>Lịch sử Truyền File</h3>
        <table>
            <thead>
                <tr>
                    <th>Tên File</th>
                    <th>Kích Thước</th>
                    <th>Thời Gian</th>
                    <th>Trạng Thái</th>
                    <th>Thu hồi file</th>
                </tr>
            </thead>
            <tbody id="historyTableBody">
                <!-- Data will be populated here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Kiểm tra quyền truy cập nhanh tại client
    if(localStorage.getItem("role") !== "client") { window.location.href = "/login"; }
    document.getElementById("welcomeMsg").innerText = `Tài khoản: ${localStorage.getItem("username")} (Client)`;

    const historyKey = "uploadHistory_" + localStorage.getItem("username");

    function getHistory() {
        return JSON.parse(localStorage.getItem(historyKey) || "[]");
    }

    function renderHistory() {
        const history = getHistory();
        const tbody = document.getElementById('historyTableBody');
        if (history.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color:#999;">Chưa có lịch sử truyền file.</td></tr>`;
            return;
        }
        // Sao chép mảng và đảo ngược để hiển thị file mới nhất lên đầu
        tbody.innerHTML = [...history].reverse().map(item => `
            <tr>
                <td><strong>${item.fileName}</strong></td>
                <td>${(item.size / (1024*1024)).toFixed(2)} MB</td>
                <td>${item.time}</td>
                <td><span class="badge ${item.statusClass}">${item.statusText}</span></td>
                <td>
                    ${item.statusClass !== 'sending' ? `<button class="revoke-btn" onclick="revokeFile('${item.fileName}')">Thu hồi</button>` : ''}
                </td>
            </tr>
        `).join('');
    }

    function updateHistory(fileName, size, statusClass, statusText) {
        let history = getHistory();
        let existing = history.find(h => h.fileName === fileName);
        if (existing) {
            existing.statusClass = statusClass;
            existing.statusText = statusText;
        } else {
            let now = new Date();
            let timeStr = now.toLocaleTimeString() + " " + now.toLocaleDateString();
            history.push({ fileName, size, time: timeStr, statusClass, statusText });
        }
        localStorage.setItem(historyKey, JSON.stringify(history));
        renderHistory();
    }

    // Khởi tạo bảng lịch sử khi tải trang
    renderHistory();

    async function revokeFile(fileName) {
        if (!confirm("Bạn có chắc chắn muốn thu hồi (xóa vĩnh viễn) file " + fileName + " khỏi server?")) return;
        
        try {
            let res = await fetch('/api/revoke/' + encodeURIComponent(fileName), { method: 'DELETE' });
            if (res.ok) {
                let history = getHistory();
                history = history.filter(h => h.fileName !== fileName);
                localStorage.setItem(historyKey, JSON.stringify(history));
                renderHistory();
                alert("Đã thu hồi thành công!");
            } else {
                let errText = await res.text();
                alert("Lỗi khi thu hồi file: " + errText);
            }
        } catch (err) {
            alert("Lỗi kết nối tới ClientWeb.");
        }
    }

    let selectedFile = null;
    const dropZone = document.getElementById('dropZone');
    ['dragenter', 'dragover'].forEach(eName => dropZone.addEventListener(eName, (e) => { e.preventDefault(); dropZone.classList.add('dragover'); }));
    ['dragleave', 'drop'].forEach(eName => dropZone.addEventListener(eName, (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); }));
    dropZone.addEventListener('drop', (e) => handleFileSelect(e.dataTransfer.files[0]));

    function handleFileSelect(file) {
        if (!file) return;
        selectedFile = file;
        const fileInfo = document.getElementById('fileInfo');
        fileInfo.style.display = "block";
        fileInfo.innerHTML = `<strong>Tên file:</strong> ${file.name}<br><strong>Kích thước:</strong> ${(file.size / (1024*1024)).toFixed(2)} MB`;
        document.getElementById('startBtn').disabled = false;
        document.getElementById('status').innerText = "Trạng thái: Sẵn sàng.";
    }

    async function startTransfer() {
        if (!selectedFile) return;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('progressBarContainer').style.display = "block";
        
        updateHistory(selectedFile.name, selectedFile.size, "sending", "Đang gửi...");

        const chunkSize = 1024 * 1024; // 1MB
        const totalSize = selectedFile.size;
        let offset = 0;

        const sendChunk = async () => {
            if (offset >= totalSize) {
                document.getElementById('progressBar').style.width = '100%';
                document.getElementById('status').innerText = "HOÀN THÀNH TRUYỀN FILE GIỮA CÁC SERVER!";
                document.getElementById('startBtn').disabled = false;
                updateHistory(selectedFile.name, totalSize, "success", "Đã hoàn thành");
                return;
            }

            const slice = selectedFile.slice(offset, offset + chunkSize);
            let formData = new FormData();
            formData.append("fileName", selectedFile.name);
            formData.append("totalSize", totalSize);
            formData.append("chunkOffset", offset);
            formData.append("chunkSize", slice.size);
            formData.append("file", slice);

            let pct = Math.round((offset / totalSize) * 100);
            document.getElementById('status').innerText = `Đang tải lên... ${pct}%`;
            document.getElementById('progressBar').style.width = pct + '%';

            try {
                let response = await fetch('/api/upload-chunk', { method: 'POST', body: formData });
                if (!response.ok) {
                    document.getElementById('status').innerText = "Lỗi Server chặn gửi file.";
                    document.getElementById('startBtn').disabled = false;
                    updateHistory(selectedFile.name, totalSize, "error", "Lỗi máy chủ");
                    return;
                }
                offset += chunkSize;
                sendChunk();
            } catch (err) {
                document.getElementById('status').innerText = "Mất kết nối ClientWeb!";
                document.getElementById('startBtn').disabled = false;
                updateHistory(selectedFile.name, totalSize, "error", "Lỗi kết nối");
            }
        };
        sendChunk();
    }

    function logout() { localStorage.clear(); window.location.href = "/login"; }
</script>
</body>
</html>
